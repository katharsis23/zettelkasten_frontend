services:
  web:
    build:
      context: .
      args:
        - TARGET_OS=web
    ports:
      - "8080:80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
  
